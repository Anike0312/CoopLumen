/api/v1/transactions/submit:
  post:
    tags: [Transactions]
    summary: Submit a signed Stellar transaction
    description: Accepts a base64-encoded signed XDR string (typically from Freighter) and submits it to Horizon. Maps Horizon errors to actionable client messages.
openapi: 3.0.3
info:
  title: CoopLumen API
  description: REST API for CoopLumen communities and Stellar assets.
  version: 0.1.0
servers:
  - url: http://localhost:4000

tags:
  - name: Auth
    description: Wallet challenge, verification, and session-auth endpoints
  - name: Tokens
    description: Community token metadata and operations
  - name: Balances
    description: Stellar account balances and related balance views
  - name: Prices
    description: Public market price feeds for Stellar assets
  - name: Accounts
    description: Full Stellar account details and state
  - name: Transactions
    description: Stellar transaction submission endpoints
  - name: Communities
    description: Community registration and management
  - name: Members
    description: Community membership management
  - name: Treasury
    description: Community treasury balances
  - name: Loans
    description: Peer-to-peer loan lifecycle within a community
  - name: Fees
    description: Stellar network fee estimation
  - name: Webhooks
    description: Inbound webhook endpoints for Stellar account/transaction event notifications
  - name: BatchPayments
    description: Batch payment disbursement, preview, and CSV parsing endpoints
  - name: Stream
    description: Server-Sent Events feeds of live account activity
  - name: Proposals
    description: Governance proposal creation and read models
  - name: KYC
    description: Account identity verification flows
  - name: Auth
    description: Wallet sign-in (challenge, signature, session cookie)

paths:
  /api/v1/proposals:
    get:
      tags: [Proposals]
      summary: List proposals for a community
      parameters:
        - name: communityId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, passed, rejected, executed, cancelled]
      responses:
        '200':
          description: Community proposals with current database tallies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GovernanceProposal' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Proposals]
      summary: Create a proposal
      description: Creates the database read model for an authenticated active community member.
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGovernanceProposal' }
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GovernanceProposal' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Caller is not an active member of the community
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/proposals/{id}:
    get:
      tags: [Proposals]
      summary: Get proposal detail and current tally
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Proposal detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GovernanceProposal' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/kyc/initiate:
    post:
      tags: [KYC]
      summary: Start or resume KYC verification
      description: Starts a pending KYC flow for the authenticated member's own address. Pending and submitted flows are idempotent; rejected or expired flows are restarted.
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitiateKycRequest' }
      responses:
        '200':
          description: An existing pending flow was returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InitiateKycResponse' }
        '201':
          description: A new or restarted pending flow was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InitiateKycResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Address mismatch or inactive community membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Address is already verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out by clearing the session cookie
      description: >
        Expires the httpOnly `cooplumen_session` cookie. Idempotent and public: it returns 200
        whether or not a cookie was sent. Session tokens are stateless, so a token copied elsewhere
        remains valid until its own expiry; logout only removes it from the browser.
      responses:
        '200':
          description: Session cookie cleared
          headers:
            Set-Cookie:
              description: The `cooplumen_session` cookie with an expiry in the past
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutResponse'
  /api/v1/auth/verify:
    post:
      tags: [Auth]
      summary: Verify a signed challenge and start a session
      description: >
        Verifies the Ed25519 signature over a challenge issued by
        `POST /api/v1/auth/challenge`. On success the session token is set in an
        httpOnly, SameSite=Strict cookie (`Secure` in production) and also returned
        in the body for non-browser clients. Challenges are single-use: they are
        consumed whether or not the signature is valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyRequest'
      responses:
        '200':
          description: Signature verified; session cookie set
          headers:
            Set-Cookie:
              description: The `cooplumen_session` cookie (HttpOnly; SameSite=Strict; Path=/)
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifyResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: No matching challenge, or the signature is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the session using a rotating refresh token
      description: >
        Exchanges the httpOnly `cooplumen_refresh` cookie (set by `POST /api/v1/auth/verify`)
        for a new session token, set in the `cooplumen_session` cookie and returned in the body.
        Refresh tokens are single-use: the presented token is invalidated and a new one is set,
        so replaying a used token returns 401.
      security:
        - RefreshCookie: []
      responses:
        '200':
          description: New session issued; session and refresh cookies set
          headers:
            Set-Cookie:
              description: The rotated `cooplumen_refresh` cookie and a new `cooplumen_session` cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
        '401':
          description: Refresh token missing, unknown, already used, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/communities:
    get:
      tags: [Communities]
      summary: List communities
      description: Paginated, optionally full-text-searched list of active communities.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema: { type: string }
          description: Full-text search over name and description.
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, name, updated_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: A page of communities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Community' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Communities]
      summary: Register a community
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommunity' }
      responses:
        '201':
          description: Community created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Community' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Community name already taken

  /api/v1/communities/search:
    get:
      tags: [Communities]
      summary: Search communities
      description: Dedicated full-text search over community name and description.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query text; 400 if missing or blank.
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of matching communities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Community' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: Missing or blank `q` query parameter

  /api/v1/auth/challenge/{publicKey}:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key that will sign the challenge.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Auth]
      summary: Create a wallet challenge for a public key
      description: >
        Returns a one-time authentication challenge string to be signed by the wallet
        that controls `publicKey`. The challenge is single-use and expires after five minutes.
      responses:
        '200':
          description: Authentication challenge issued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      challenge:
                        type: string
                        description: One-time challenge text signed by the wallet.
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/prices/xlm:
    get:
      tags: [Prices]
      summary: Get XLM price
      description: >
        Returns current XLM market price (default XLM/USD) fetched from public market data providers.
        Responses may be served from a Redis cache for up to 30 seconds.
      parameters:
        - name: currency
          in: query
          required: false
          description: Target fiat/quote currency (e.g., USD, EUR, GBP). Defaults to USD.
          schema:
            type: string
            pattern: '^[A-Za-z]{3,4}$'
            default: USD
      responses:
        '200':
          description: Current market price for XLM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Failed to fetch price from public source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{publicKey}:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key of the account to inspect.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Accounts]
      summary: Get full Stellar account details
      description: >
        Returns full Stellar account details from Horizon for the given public key,
        including sequence number, balances, signers, thresholds, flags, and account data entries.
      responses:
        '200':
          description: Full account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailsResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/balances/{publicKey}:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key of the account to inspect.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Balances]
      summary: Get account balances
      description: >
        Returns all on-chain balances for a Stellar account. Successful responses
        may be served from a Redis cache for up to 5 seconds; the response body
        itself is unchanged.
      responses:
        '200':
          description: Account balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{publicKey}/trustlines:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key of the account to inspect.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Accounts]
      summary: List established trustlines
      description: >
        Returns all non-native asset trustlines established by the account.
        Fetched live from Horizon via loadAccount. Returns an empty array
        when the account exists but has no trustlines. Horizon 429/503
        errors are retried with exponential backoff before a 502 is returned.
      responses:
        '200':
          description: Established trustlines (empty array if none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trustline'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/balances/{publicKey}/history:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key whose audit history should be returned.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Balances]
      summary: Get balance-change audit history
      description: >
        Returns transactions_log audit entries associated with the Stellar
        address, ordered newest first. Action-specific balance information is
        preserved in each entry's metadata object.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated balance-change audit history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceHistoryResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: Audit history could not be queried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/balances/{publicKey}/loans:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key to look up as either borrower or lender.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Balances, Loans]
      summary: List loans involving an address
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of loans where the address is borrower or lender
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/balances/community/{communityId}/loans:
    parameters:
      - $ref: '#/components/parameters/CommunityId'
    get:
      tags: [Balances, Loans]
      summary: List loans in a community
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of loans belonging to the community
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/fees/estimate:
    get:
      tags: [Fees]
      summary: Estimate transaction fees
      description: >
        Returns the current Stellar network base fee and key percentile fee
        distribution fetched live from Horizon. Horizon 429/503 errors are
        retried with exponential backoff before a 502 is returned.
      responses:
        '200':
          description: Current fee statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeeEstimate'
        '502':
          description: Stellar network error or Horizon temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/stream/payments:
    get:
      tags: [Stream]
      summary: Stream payment operations for an account
      description: >
        Opens a Server-Sent Events (`text/event-stream`) feed of payment
        operations for a Stellar account, backed by Horizon's payment stream.
        Frames are JSON in the same `{ data, meta?, error? }` envelope the rest
        of the API uses, so a client parses one response shape whether a frame
        carries a payment or a failure: `event: ready` echoes the account and
        cursor once the subscription is live, `event: payment` carries
        `{ data: <Horizon payment operation record> }`, and `event: error`
        carries `{ data: null, error: <message> }` without closing the stream.
        A comment-only keep-alive frame is written every 15 seconds so proxies
        do not drop an idle connection, and a `retry: 3000` field tells the
        browser how long to wait before reconnecting. Validation runs before
        any header is flushed, so an invalid `publicKey` still receives the
        standard `400` JSON envelope; once streaming has begun the status is
        already `200` and failures arrive as `error` frames instead.
      parameters:
        - name: publicKey
          in: query
          required: true
          description: Stellar account whose payments should be streamed.
          schema: { $ref: '#/components/schemas/StellarKey' }
        - name: cursor
          in: query
          required: false
          description: >
            Horizon paging token to resume from. `now` streams only events from
            this moment on, which is the default for a live feed.
          schema: { type: string, default: now, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: >
            A Server-Sent Events stream. Frames are separated by a blank line
            and each carries an `event:` name, a `data:` JSON envelope and a
            trailing `meta` where applicable. Comment-only `: keep-alive`
            frames are interleaved to hold the connection open.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  retry: 3000

                  event: ready
                  data: {"data":{"publicKey":"G...","cursor":"now"}}

                  event: payment
                  data: {"data":{"id":"1234","type":"payment","amount":"10.0000000"}}

        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/tokens/transfer:
    post:
      tags: [Transactions]
      summary: Submit a signed Stellar payment transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTransferRequest'
      responses:
        '200':
          description: Payment submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '402':
          description: The source account does not have enough XLM for the payment and fee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientBalanceResponse'
        '422':
          description: The Stellar network rejected the signed transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/webhooks/stellar:
    post:
      tags: [Webhooks]
      summary: Receive a Stellar account/transaction event notification
      description: >
        Accepts event notifications from a trusted Stellar webhook source
        (e.g. a Horizon-event forwarder). The request must carry an
        `X-Stellar-Webhook-Signature` header containing the hex-encoded
        HMAC-SHA256 digest of the raw request body, keyed with the server's
        `STELLAR_WEBHOOK_SECRET`. The signature is verified before the body
        is validated, so a request with an invalid signature never reaches
        payload validation.
      parameters:
        - name: X-Stellar-Webhook-Signature
          in: header
          required: true
          description: Hex-encoded HMAC-SHA256 digest of the raw request body.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StellarWebhookPayload'
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [received, eventId]
                    properties:
                      received: { type: boolean, example: true }
                      eventId: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Missing or invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The server has no webhook secret configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/unsigned:
    post:
      tags: [Transactions]
      summary: Build an unsigned Stellar payment transaction
      description: >
        Loads the source account and its current sequence number from Horizon,
        then returns a single-operation payment transaction XDR for wallet signing.
        The transaction is not signed or submitted by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsignedPaymentRequest'
      responses:
        '200':
          description: Unsigned payment transaction built successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsignedPaymentResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: The source Stellar account does not exist on the configured network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/submit:
    post:
      tags: [Transactions]
      summary: Submit a signed Stellar transaction
      description: Accepts a base64-encoded signed XDR string (typically from Freighter) and submits it to Horizon. Maps Horizon errors to actionable client messages.
  /api/v1/trustlines/build:
    post:
      tags: [Transactions, Tokens]
      summary: Build an unsigned Stellar trustline establishment transaction
      description: >
        Loads the account and its current sequence number from Horizon,
        then returns a single-operation changeTrust transaction XDR for wallet signing.
        The transaction is not signed or submitted by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [xdr]
              properties:
                xdr:
                  type: string
                  description: The signed transaction envelope XDR
                  example: 'AAAAAgAAA...'
      responses:
        '200':
          description: Transaction successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      hash: { type: string }
                      ledger: { type: integer }
                      status: { type: string }
                  meta:
                    type: object
                    properties:
                      timestamp: { type: string }
        '400':
          description: Validation error or Horizon transaction rejection (e.g., bad sequence, insufficient funds)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message: { type: string }
                      rawCode: { type: string }
                      details: { type: object }

  /api/v1/transactions/{communityId}:
    get:
      tags: [Transactions]
      summary: Get community transaction history
      description: Returns a paginated transaction-history audit trail for a specific community, ordered newest first.
      parameters:
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A paginated list of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BalanceHistoryEntry' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: Audit history could not be queried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tokens/build-trustline:
    post:
      tags: [Tokens]
      summary: Build an unsigned trustline transaction for client-side signing
      description: >-
        Returns a base64-encoded XDR envelope establishing a trustline to the
        given asset. The wallet signs it locally and submits it through
        POST /api/v1/tokens/submit, so no secret key reaches the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildTrustlineRequest'
      responses:
        '200':
          description: Unsigned trustline transaction built successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildTrustlineResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: The Stellar account does not exist on the configured network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tokens/build-airdrop:
    post:
      tags: [Tokens]
      summary: Build an unsigned airdrop transaction for client-side signing
      description: >-
        Returns one base64-encoded XDR envelope paying an equal amount of the
        community's token to every current member, for the issuer's wallet to
        sign. The batch is atomic: every member is paid or none is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [communityId, issuerPublicKey, amount]
              properties:
                communityId: { type: string, format: uuid }
                issuerPublicKey: { $ref: '#/components/schemas/StellarKey' }
                amount: { type: string }
                memo: { type: string, maxLength: 28 }
      responses:
        '200':
          description: Unsigned airdrop transaction built successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      xdr: { type: string }
                      recipientCount: { type: integer }
                      amount: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: Community does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/batch/disburse:
    post:
      tags: [BatchPayments]
      summary: Execute atomic batch payment to multiple recipients
      description: Submits a single transaction carrying up to 100 payment operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senderSecret, payments]
              properties:
                senderSecret: { type: string }
                payments:
                  type: array
                  items:
                    type: object
                    required: [destinationPublicKey, amount, assetCode]
                    properties:
                      destinationPublicKey: { $ref: '#/components/schemas/StellarKey' }
                      amount: { type: string }
                      assetCode: { type: string }
                      assetIssuer: { $ref: '#/components/schemas/StellarKey' }
                memo: { type: string, maxLength: 28 }
      responses:
        '200':
          description: Batch transaction submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      hash: { type: string }
                      paymentsCount: { type: integer }
                      totalAmount: { type: string }
                      memo: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/batch/preview:
    post:
      tags: [BatchPayments]
      summary: Preview batch payment fees, totals, and unsigned XDR
      description: Calculates estimated fees, sums per asset, and builds unsigned XDR before signing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senderPublicKey, payments]
              properties:
                senderPublicKey: { $ref: '#/components/schemas/StellarKey' }
                payments:
                  type: array
                  items:
                    type: object
                    required: [destinationPublicKey, amount, assetCode]
                    properties:
                      destinationPublicKey: { $ref: '#/components/schemas/StellarKey' }
                      amount: { type: string }
                      assetCode: { type: string }
                      assetIssuer: { $ref: '#/components/schemas/StellarKey' }
                memo: { type: string, maxLength: 28 }
      responses:
        '200':
          description: Batch preview calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recipientCount: { type: integer }
                      totalAmounts: { type: object }
                      estimatedFeeStroops: { type: integer }
                      xdr: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/batch/parse-csv:
    post:
      tags: [BatchPayments]
      summary: Parse CSV content for batch payment disbursement
      description: Parses address,amount CSV lines and validates recipient addresses and amounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string }
                defaultAssetCode: { type: string, default: XLM }
                defaultAssetIssuer: { $ref: '#/components/schemas/StellarKey' }
      responses:
        '200':
          description: CSV parsed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      entries: { type: array }
                      validCount: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/tokens/{assetCode}/{issuer}:
    get:
      tags: [Tokens]
      summary: Get token metadata
      description: Returns the off-chain metadata for one Stellar custom asset.
      parameters:
        - name: assetCode
          in: path
          required: true
          description: Stellar asset code.
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{1,12}$'
        - name: issuer
          in: path
          required: true
          description: Stellar public key of the asset issuer.
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
      responses:
        '200':
          description: Token metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenMetadataResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tokens/{communityId}:
    get:
      tags: [Tokens]
      summary: List tokens issued for a community
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tokens issued for the community
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Token' }

  /api/v1/tokens/build-burn:
    post:
      tags: [Tokens]
      summary: Build an unsigned burn transaction for client-side signing
      description: >-
        Returns a base64-encoded XDR envelope returning tokens to their issuing
        account, where they stop counting toward circulating supply. The
        holder's wallet signs it locally and submits it through
        POST /api/v1/tokens/submit with `refreshSupply` set, so no secret key
        reaches the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holderPublicKey, assetCode, assetIssuer, amount]
              properties:
                holderPublicKey: { $ref: '#/components/schemas/StellarKey' }
                assetCode: { type: string, minLength: 1, maxLength: 12 }
                assetIssuer: { $ref: '#/components/schemas/StellarKey' }
                amount: { type: string }
      responses:
        '200':
          description: Unsigned burn transaction built successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      xdr: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tokens:
    get:
      tags: [Tokens]
      summary: List all tokens (Admin)
      description: >
        Admin endpoint to list all tokens across all communities.
        Requires admin authentication. Supports pagination and sorting.
      security:
        - AdminAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, name, asset_code, total_supply]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated list of tokens across all communities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TokenWithCommunity' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/loans:
    get:
      tags: [Loans]
      summary: List loans
      description: Paginated, filterable list of loans.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: communityId
          in: query
          schema: { type: string, format: uuid }
        - name: borrower
          in: query
          schema: { $ref: '#/components/schemas/StellarKey' }
        - name: lender
          in: query
          schema: { $ref: '#/components/schemas/StellarKey' }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, repaid, defaulted, cancelled]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, amount, due_at, updated_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: A page of loans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Loans]
      summary: Create a loan request
      description: Records a new loan in `pending` status and seeds its event log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLoan' }
      responses:
        '201':
          description: Loan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Loan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/loans/{id}:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    get:
      tags: [Loans]
      summary: Get a loan
      description: Enriched with its full event history and outstanding balance.
      responses:
        '200':
          description: Loan detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Loan'
                      - type: object
                        properties:
                          outstanding: { type: string }
                          events:
                            type: array
                            items: { $ref: '#/components/schemas/LoanEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Loans]
      summary: Cancel a loan
      description: Cancels a loan that has not yet been disbursed (status `pending`).
      responses:
        '200':
          description: Loan cancelled
        '404':
          description: No pending loan found to cancel

  /api/v1/loans/{id}/events:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    get:
      tags: [Loans]
      summary: List loan events
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of loan events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LoanEvent' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /api/v1/loans/{id}/disburse:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    post:
      tags: [Loans]
      summary: Disburse a loan
      description: Transitions a `pending` loan to `active` once funds have been sent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stellarTxHash: { type: string }
                note: { type: string }
      responses:
        '200':
          description: Loan disbursed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Loan' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Loan is not in `pending` status

  /api/v1/loans/{id}/repay:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    post:
      tags: [Loans]
      summary: Record a loan repayment
      description: >
        Records a partial or full repayment. When the outstanding balance
        reaches zero the loan is marked `repaid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string }
                paymentId: { type: string, format: uuid }
                note: { type: string }
      responses:
        '200':
          description: Repayment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Loan' }
        '400':
          description: Repayment exceeds the outstanding balance, or validation failed
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Loan is not in `active` status

  /api/v1/loans/{id}/default:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    post:
      tags: [Loans]
      summary: Mark a loan as defaulted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Loan marked as defaulted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Loan' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Loan is not in `active` status

  /api/v1/reputation:
    get:
      tags: [Reputation]
      summary: Reputation leaderboard
      description: Paginated leaderboard, highest score first by default.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: communityId
          in: query
          schema: { type: string, format: uuid }
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [score, total_loans, on_time_repayments, defaults, updated_at]
            default: score
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: A page of reputation scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReputationScore' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /api/v1/reputation/{address}:
    parameters:
      - name: address
        in: path
        required: true
        schema: { $ref: '#/components/schemas/StellarKey' }
    get:
      tags: [Reputation]
      summary: Get a member's reputation
      description: >
        A member's reputation across every community they participate in, plus
        an aggregate summary. Optionally narrowed with `communityId`.
      parameters:
        - name: communityId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Member reputation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      address: { $ref: '#/components/schemas/StellarKey' }
                      communities:
                        type: array
                        items: { $ref: '#/components/schemas/ReputationScore' }
                      summary: { $ref: '#/components/schemas/ReputationSummary' }
        '404':
          description: No reputation found for this address
components:
  parameters:
    CommunityId:
      name: id
      in: path
      required: true
      description: Community UUID.
      schema: { type: string, format: uuid }
    LoanId:
      name: id
      in: path
      required: true
      description: Loan UUID.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Page size, capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateGovernanceProposal:
      type: object
      required: [communityId, title, votingEndsAt]
      properties:
        communityId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        type:
          type: string
          enum:
            [
              general,
              loan_approval,
              member_removal,
              treasury_spend,
              settings_change,
              token_issuance,
            ]
          default: general
        quorumPercent: { type: number, minimum: 0, maximum: 100, default: 50 }
        metadata: { type: object, additionalProperties: true }
        votingEndsAt: { type: string, format: date-time }
    GovernanceProposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        community_id: { type: string, format: uuid }
        proposer_address: { $ref: '#/components/schemas/StellarKey' }
        title: { type: string }
        description: { type: string, nullable: true }
        type: { type: string }
        status: { type: string }
        quorum_percent: { type: string }
        metadata: { type: object, nullable: true, additionalProperties: true }
        voting_starts_at: { type: string, format: date-time }
        voting_ends_at: { type: string, format: date-time }
        votes_for: { type: string }
        votes_against: { type: string }
        votes_abstain: { type: string }
    InitiateKycRequest:
      type: object
      required: [communityId, address]
      properties:
        communityId: { type: string, format: uuid }
        address: { $ref: '#/components/schemas/StellarKey' }
        provider: { type: string, default: sep12, maxLength: 100 }
    InitiateKycResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, communityId, address, status, provider, initiatedAt]
          properties:
            id: { type: string, format: uuid }
            communityId: { type: string, format: uuid }
            address: { $ref: '#/components/schemas/StellarKey' }
            status: { type: string, enum: [pending] }
            provider: { type: string, nullable: true }
            initiatedAt: { type: string, format: date-time }
    AuthLogoutResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            loggedOut: { type: boolean }
    AuthVerifyRequest:
      type: object
      required: [address, challenge, signature]
      properties:
        address: { type: string, description: Stellar public key that signed the challenge }
        challenge:
          { type: string, description: The exact challenge string returned by /auth/challenge }
        signature:
          { type: string, description: Base64-encoded Ed25519 signature over the challenge }
    AuthVerifyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token: { type: string }
            address: { type: string }
            expiresAt: { type: string, format: date-time }
    AuthRefreshResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token: { type: string }
            address: { type: string }
            expiresAt: { type: string, format: date-time }
    StellarKey:
      type: string
      description: A 56-character Stellar StrKey public key.
      pattern: '^G[A-Z2-7]{55}$'
    Trustline:
      type: object
      required: [asset_type, asset_code, asset_issuer, balance, limit]
      properties:
        asset_type:
          type: string
          enum: [credit_alphanum4, credit_alphanum12]
          description: Stellar asset type (always non-native for trustlines)
        asset_code:
          type: string
          description: Asset code (e.g. USDC, ECO)
        asset_issuer:
          $ref: '#/components/schemas/StellarKey'
        balance:
          type: string
          description: Current balance of the asset held by the account
          example: '10.0000000'
        limit:
          type: string
          description: Maximum amount of the asset the account is willing to hold
          example: '922337203685.4775807'
        buying_liabilities:
          type: string
          example: '0.0000000'
        selling_liabilities:
          type: string
          example: '0.0000000'
        last_modified_ledger:
          type: integer
          description: Ledger sequence when the trustline was last modified
          example: 2638989
        is_authorized:
          type: boolean
          description: Whether the issuer has authorized the account to hold the asset
        is_authorized_to_maintain_liabilities:
          type: boolean
    FeeEstimate:
      type: object
      required: [baseFee, lastLedger, ledgerCapacityUsage, feeCharged]
      properties:
        baseFee:
          type: integer
          description: Minimum fee per operation in stroops (from last_ledger_base_fee)
          example: 100
        lastLedger:
          type: string
          description: Sequence number of the most recent ledger used for fee calculation
          example: '4372364'
        ledgerCapacityUsage:
          type: string
          description: Fraction of ledger capacity used in the recent ledger sample (0.0–1.0)
          example: '0.07'
        feeCharged:
          type: object
          required: [min, mode, p10, p50, p90, p95, p99]
          properties:
            min: { type: string, description: Minimum fee charged, example: '100' }
            mode: { type: string, description: Most common fee charged, example: '100' }
            p10: { type: string, description: 10th percentile fee charged, example: '100' }
            p50: { type: string, description: 50th percentile (median) fee charged, example: '100' }
            p90: { type: string, description: 90th percentile fee charged, example: '95947' }
            p95: { type: string, description: 95th percentile fee charged, example: '154834' }
            p99: { type: string, description: 99th percentile fee charged, example: '706514' }
    BalanceLine:
      type: object
      required: [asset_type, balance]
      description: >
        A Horizon balance line. The account's native XLM balance is represented
        by asset_type `native`; issued assets include asset_code and asset_issuer.
      properties:
        asset_type:
          type: string
          enum: [native, credit_alphanum4, credit_alphanum12]
          description: "'native' represents the account's XLM balance."
        asset_code: { type: string, nullable: true }
        asset_issuer: { type: string, nullable: true }
        balance: { type: string }
    BalanceResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BalanceLine'
    BalanceHistoryEntry:
      type: object
      required: [id, community_id, actor_address, action, stellar_tx_hash, metadata, created_at]
      properties:
        id: { type: string, format: uuid }
        community_id: { type: string, format: uuid, nullable: true }
        actor_address:
          allOf:
            - $ref: '#/components/schemas/StellarKey'
          nullable: true
        action:
          type: string
          description: Audit action such as payment_sent, token_issued, or loan_repayment.
        stellar_tx_hash: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Action-specific values such as amount, asset_code, or loan_id.
        created_at: { type: string, format: date-time }
    BalanceHistoryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BalanceHistoryEntry'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        db: { type: string, example: ok }
        stellar: { type: string, example: ok }
        uptime: { type: integer }
        version: { type: string }
    Community:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        issuer_public_key: { $ref: '#/components/schemas/StellarKey' }
        asset_code: { type: string }
        asset_issuer: { $ref: '#/components/schemas/StellarKey' }
        avatar_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Member:
      type: object
      properties:
        stellar_address: { $ref: '#/components/schemas/StellarKey' }
        role:
          type: string
          enum: [admin, treasurer, member, observer]
        joined_at: { type: string, format: date-time }
    CommunityDetail:
      allOf:
        - $ref: '#/components/schemas/Community'
        - type: object
          properties:
            member_count: { type: integer }
            tokens:
              type: array
              items: { type: object }
            stats:
              type: object
              properties:
                total_transactions: { type: integer }
                total_token_supply: { type: number }
    CreateCommunity:
      type: object
      required: [name, issuerPublicKey, assetCode, assetIssuer]
      properties:
        name: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, maxLength: 500 }
        issuerPublicKey: { $ref: '#/components/schemas/StellarKey' }
        assetCode: { type: string, minLength: 1, maxLength: 12 }
        assetIssuer: { $ref: '#/components/schemas/StellarKey' }
    UpdateCommunity:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, nullable: true, maxLength: 500 }
        settings: { type: object, additionalProperties: true }
    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        pages: { type: integer }
        offset: { type: integer }
    ValidationIssue:
      type: object
      properties:
        path:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        message: { type: string }
    ValidationErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          nullable: true
        meta:
          type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
    Error:
      type: object
      properties:
        error: { type: string }
    StellarWebhookPayload:
      type: object
      required: [eventId, eventType, occurredAt, data]
      properties:
        eventId:
          type: string
          minLength: 1
        eventType:
          type: string
          enum:
            - transaction.succeeded
            - transaction.failed
            - account.created
            - trustline.created
            - trustline.removed
            - payment.received
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    TokenTransferRequest:
      type: object
      required: [signedXdr]
      properties:
        signedXdr:
          type: string
          minLength: 1
          maxLength: 100000
    TokenTransferResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            txHash: { type: string }
    UnsignedPaymentRequest:
      type: object
      required: [senderPublicKey, destinationPublicKey, assetCode, amount]
      properties:
        senderPublicKey:
          $ref: '#/components/schemas/StellarKey'
        destinationPublicKey:
          $ref: '#/components/schemas/StellarKey'
        assetCode:
          type: string
          pattern: '^[A-Za-z0-9]{1,12}$'
          description: Use XLM for the native asset.
        assetIssuer:
          allOf:
            - $ref: '#/components/schemas/StellarKey'
          description: Required for non-XLM assets and omitted for native XLM.
        amount:
          type: string
          pattern: '^(?:0|[1-9]\d*)(?:\.\d{1,7})?$'
          description: Positive decimal amount with up to 7 fractional digits.
        memo:
          type: string
          description: Optional text memo of at most 28 UTF-8 bytes.
      example:
        senderPublicKey: GCFIRY65OQE7DFP5KLNS2PF2LVZMUZYJX4OZIEQ36N2IQANUB5XVYOJR
        destinationPublicKey: GCATS5YOVB6ROX2WUNKGNQ2MP3GMXDMKSG2O4N5CLX3A6W4PZGZZI55U
        assetCode: XLM
        amount: '10.5'
        memo: Community payment
    UnsignedPaymentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [xdr]
          properties:
            xdr:
              type: string
              description: Base64-encoded unsigned Stellar transaction envelope XDR.
    BuildTrustlineRequest:
      type: object
      required: [accountPublicKey, assetCode, assetIssuer]
      properties:
        accountPublicKey:
          $ref: '#/components/schemas/StellarKey'
          description: Stellar public key of the account establishing the trustline.
        assetCode:
          type: string
          pattern: '^[A-Za-z0-9]{1,12}$'
          description: Stellar asset code to trust.
        assetIssuer:
          $ref: '#/components/schemas/StellarKey'
          description: Stellar public key of the asset issuer.
        limit:
          type: string
          pattern: '^(?:0|[1-9]\d*)(?:\.\d{1,7})?$'
          description: Optional maximum amount of the asset to trust.
      example:
        accountPublicKey: GCFIRY65OQE7DFP5KLNS2PF2LVZMUZYJX4OZIEQ36N2IQANUB5XVYOJR
        assetCode: COOP
        assetIssuer: GCATS5YOVB6ROX2WUNKGNQ2MP3GMXDMKSG2O4N5CLX3A6W4PZGZZI55U
        limit: '1000'
    BuildTrustlineResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [xdr]
          properties:
            xdr:
              type: string
              description: Base64-encoded unsigned Stellar transaction envelope XDR.
    AirdropRequest:
      type: object
      required: [communityId, amount, issuerSecret]
      properties:
        communityId:
          type: string
          format: uuid
        amount:
          type: string
          description: Positive decimal amount with up to 7 fractional digits.
        issuerSecret:
          type: string
          description: Stellar secret key for the issuing account.
    AirdropResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            amount: { type: string }
            recipientCount: { type: integer }
            txHashes:
              type: array
              items: { type: string }
    InsufficientBalanceError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INSUFFICIENT_BALANCE
        message:
          type: string
        requiredXlm:
          type: string
          nullable: true
        currentBalance:
          type: string
          nullable: true
    InsufficientBalanceResponse:
      type: object
      required: [data, error]
      properties:
        data:
          nullable: true
        error:
          $ref: '#/components/schemas/InsufficientBalanceError'
    Token:
      type: object
      properties:
        id: { type: string, format: uuid }
        community_id: { type: string, format: uuid }
        asset_code: { type: string }
        asset_issuer: { $ref: '#/components/schemas/StellarKey' }
        distributor_address: { $ref: '#/components/schemas/StellarKey' }
        total_supply: { type: string }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        icon_url: { type: string, nullable: true }
        decimals: { type: integer, minimum: 0, maximum: 7, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TokenWithCommunity:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          properties:
            community_name: { type: string, nullable: true }
    BurnToken:
      type: object
      required: [asset_code, asset_issuer]
      properties:
        id:
          type: string
        community_id:
          type: string
          format: uuid
        asset_code:
          type: string
        asset_issuer:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TokenMetadata:
      type: object
      properties:
        id: { type: string, format: uuid }
        asset_code: { type: string }
        asset_issuer: { $ref: '#/components/schemas/StellarKey' }
        name: { type: string }
        description: { type: string, nullable: true }
    TokenMetadataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TokenMetadata'
    IssueToken:
      type: object
      required: [issuerSecret, assetCode, distributorPublicKey, amount]
      properties:
        communityId: { type: string, format: uuid }
        issuerSecret: { type: string, pattern: '^S[A-Z2-7]{55}$' }
        assetCode: { type: string, minLength: 1, maxLength: 12, pattern: '^[A-Za-z0-9]+$' }
        distributorPublicKey: { $ref: '#/components/schemas/StellarKey' }
        amount: { type: string, pattern: '^(?:0|[1-9]\d*)(?:\.\d{1,7})?$' }
        memo: { type: string, maxLength: 28 }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 500 }
        iconUrl: { type: string, format: uri }
        decimals: { type: integer, minimum: 0, maximum: 7, default: 7 }
    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          nullable: true
        meta:
          type: object
          additionalProperties: true
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
    AuthChallengeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [challenge]
          properties:
            challenge:
              type: string
              description: One-time wallet challenge string to sign with Freighter.
    Loan:
      type: object
      properties:
        id: { type: string, format: uuid }
        community_id: { type: string, format: uuid }
        borrower_address: { $ref: '#/components/schemas/StellarKey' }
        lender_address: { $ref: '#/components/schemas/StellarKey' }
        amount: { type: string }
        amount_repaid: { type: string }
        asset_code: { type: string }
        asset_issuer: { $ref: '#/components/schemas/StellarKey' }
        purpose: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, active, repaid, defaulted, cancelled]
        due_at: { type: string, format: date-time, nullable: true }
        disbursed_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LoanEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        loan_id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [created, disbursed, repayment, closed, defaulted]
        amount: { type: string, nullable: true }
        payment_id: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    CreateLoan:
      type: object
      required: [communityId, borrowerAddress, lenderAddress, amount, assetCode]
      properties:
        communityId: { type: string, format: uuid }
        borrowerAddress: { $ref: '#/components/schemas/StellarKey' }
        lenderAddress: { $ref: '#/components/schemas/StellarKey' }
        amount: { type: string }
        assetCode: { type: string, minLength: 1, maxLength: 12 }
        assetIssuer: { $ref: '#/components/schemas/StellarKey' }
        purpose: { type: string, maxLength: 280 }
        dueAt: { type: string, format: date-time }
    PriceData:
      type: object
      required: [asset, currency, price, source, timestamp]
      properties:
        asset:
          type: string
          example: XLM
        currency:
          type: string
          example: USD
        price:
          type: string
          example: '0.1888200'
        source:
          type: string
          example: coingecko
        timestamp:
          type: string
          format: date-time
    PriceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PriceData'
    AccountThresholds:
      type: object
      properties:
        low_threshold: { type: integer }
        med_threshold: { type: integer }
        high_threshold: { type: integer }
    AccountFlags:
      type: object
      properties:
        auth_required: { type: boolean }
        auth_revocable: { type: boolean }
        auth_immutable: { type: boolean }
        auth_clawback_enabled: { type: boolean }
    AccountSigner:
      type: object
      properties:
        key: { type: string }
        weight: { type: integer }
        type: { type: string }
        sponsor: { type: string }
    AccountBalanceLine:
      type: object
      properties:
        asset_type: { type: string }
        balance: { type: string }
        limit: { type: string }
        buying_liabilities: { type: string }
        selling_liabilities: { type: string }
        asset_code: { type: string }
        asset_issuer: { type: string }
        last_modified_ledger: { type: integer }
        is_authorized: { type: boolean }
        is_authorized_to_maintain_liabilities: { type: boolean }
        is_clawback_enabled: { type: boolean }
        sponsor: { type: string }
    AccountDetails:
      type: object
      required:
        - id
        - account_id
        - sequence
        - subentry_count
        - last_modified_ledger
        - thresholds
        - flags
        - balances
        - signers
        - data
      properties:
        id: { $ref: '#/components/schemas/StellarKey' }
        account_id: { $ref: '#/components/schemas/StellarKey' }
        sequence: { type: string }
        sequence_ledger: { type: integer }
        sequence_time: { type: string }
        subentry_count: { type: integer }
        inflation_destination: { type: string }
        home_domain: { type: string }
        last_modified_ledger: { type: integer }
        last_modified_time: { type: string }
        thresholds: { $ref: '#/components/schemas/AccountThresholds' }
        flags: { $ref: '#/components/schemas/AccountFlags' }
        balances:
          type: array
          items: { $ref: '#/components/schemas/AccountBalanceLine' }
        signers:
          type: array
          items: { $ref: '#/components/schemas/AccountSigner' }
        data:
          type: object
          additionalProperties: { type: string }
        num_sponsoring: { type: integer }
        num_sponsored: { type: integer }
        sponsor: { type: string }
        paging_token: { type: string }
    AccountDetailsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AccountDetails'
    LoanDetail:
      allOf:
        - $ref: '#/components/schemas/Loan'
        - type: object
          properties:
            events:
              type: array
              items: { $ref: '#/components/schemas/LoanEvent' }
    LoanStatus:
      type: string
      enum: [pending, active, repaid, defaulted, cancelled]
    RepayLoan:
      type: object
      required: [amount]
      properties:
        amount: { type: string, pattern: '^\d+(\.\d{1,7})?$' }
        paymentId: { type: string, format: uuid }
        note: { type: string, maxLength: 280 }
    ReputationScore:
      type: object
      properties:
        id: { type: string, format: uuid }
        stellar_address: { $ref: '#/components/schemas/StellarKey' }
        community_id: { type: string, format: uuid }
        score: { type: string, description: 'NUMERIC(5,2), 0–100' }
        total_loans: { type: integer }
        on_time_repayments: { type: integer }
        defaults: { type: integer }
        last_calculated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReputationSummary:
      type: object
      properties:
        total_loans: { type: integer }
        on_time_repayments: { type: integer }
        defaults: { type: integer }
        offset: { type: integer }
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: CoopLumen session token
      description: HMAC-signed session token returned by `POST /api/v1/auth/verify`.
    SessionCookie:
      type: apiKey
      in: cookie
      name: cooplumen_session
      description: httpOnly session cookie set by `POST /api/v1/auth/verify`.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: cooplumen_refresh
      description: httpOnly, single-use refresh token cookie (Path=/api/v1/auth).
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Admin authentication using JWT tokens. 
        Currently a placeholder - actual implementation pending.
