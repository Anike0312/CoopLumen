name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with the node:<major>-alpine tag in backend/Dockerfile and
  # frontend/Dockerfile, and with @types/node. If CI tests on one major while
  # the image ships another, the suite stops saying anything about the runtime
  # that actually runs in production.
  NODE_VERSION: '26'

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # One check for the whole repository. Per-workspace checks left root
      # configs, scripts/ and docs/ unexamined, which is how a malformed
      # openapi.yaml and a drifting set of config files reached main.
      - name: Install root deps
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Type-check backend
        working-directory: backend
        run: npm run type-check

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cooplumen
          POSTGRES_PASSWORD: cooplumen
          POSTGRES_DB: cooplumen
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job runs.
        options: >-
          --health-cmd "pg_isready -U cooplumen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # Wait until Redis is accepting connections before the job runs.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cooplumen:cooplumen@localhost:5432/cooplumen
      REDIS_URL: redis://localhost:6379
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        run: npm run db:migrate

      - name: Run tests (unit + integration)
        working-directory: backend
        run: npm test -- --runInBand

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Serial, like the backend job. The frontend suite is now 94 suites, and
      # several of the heavier ones (userEvent-driven forms, the multi-sig E2E
      # flow) are load-sensitive: they pass alone but intermittently blow
      # Jest's default 5s budget when workers compete, failing on timing
      # rather than on any assertion. Running in band makes the gate
      # deterministic — and stricter about shared state, not looser.
      - name: Run tests
        working-directory: frontend
        run: npm test -- --runInBand

  test-contracts:
    name: Governance contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Run contract tests
        run: cargo test --workspace

  test-governance-e2e:
    name: Governance browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the Docker Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait

      - name: Run database migrations
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml
          exec -T -e DATABASE_URL=postgresql://cooplumen:cooplumen@db:5432/cooplumen
          backend npm run db:migrate

      - name: Run governance browser test
        working-directory: frontend
        env:
          AUTH_SESSION_SECRET: governance-e2e-secret
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:4000
        run: npm run test:e2e

      - name: Print service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color

      - name: Stop the Docker Compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # next build needs *a* value for these at build time; real values are
          # injected at deploy time. Keeping this here (rather than committing
          # a .env file) is what lets the build job run without secrets.
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t cooplumen-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t cooplumen-frontend:ci ./frontend

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Gate on what ships: a high-severity advisory in a production dependency
      # fails the job.
      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Dev tooling is reported but not gated. Some advisories there have no
      # patched release (braces, via ts-node-dev and eslint-config-next) and
      # only ever see developer-written glob patterns.
      - name: Report all backend advisories
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Report all frontend advisories
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Lint commits in this PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Single required status check to point branch protection at, instead of
  # every job above individually — add a job to the `needs` list here and it
  # becomes part of the gate with no branch-protection settings to update.
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        test-backend,
        test-frontend,
        test-contracts,
        test-governance-e2e,
        build,
        docker-build,
        commitlint,
      ]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
